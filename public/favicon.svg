<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#050A15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#FF2E93" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#263653" stroke-width="1.2"/>

  <!-- Architectural Precision "M" -->
  <path 
    d="M 8.5 22.5 V 9.5 L 16 16.5 L 23.5 9.5 V 22.5" 
    fill="none" 
    stroke="#F7F8FC" 
    stroke-width="2.6" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Signature Hot-Pink Core Node -->
  <circle cx="16" cy="16.5" r="2.2" fill="#FF2E93" filter="url(#glow)"/>
</svg>
