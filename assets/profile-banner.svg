<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A15"/>
      <stop offset="50%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#050A15"/>
    </linearGradient>

    <!-- Royal Blue Atmospheric Radial Bloom -->
    <radialGradient id="bloom" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1A4496" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0A1428" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050A15" stop-opacity="0"/>
    </radialGradient>

    <!-- Hot Pink Glow Filter -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF2E93" flood-opacity="0.75"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E3152" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.5px;
      fill: #F7F8FC;
    }
    .tagline {
      font-family: "Georgia", "Times New Roman", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 17px;
      fill: #F7F8FC;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #F7F8FC;
    }
    .meta-text {
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #A8B2C5;
    }
    .accent {
      fill: #FF2E93;
      font-weight: 700;
    }
  </style>

  <!-- Outer Background Container -->
  <rect width="850" height="260" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle Architectural Grid -->
  <rect width="850" height="260" rx="14" fill="url(#grid)"/>

  <!-- Atmospheric Glow Centerpiece -->
  <ellipse cx="425" cy="120" rx="380" ry="110" fill="url(#bloom)"/>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="848.5" height="258.5" rx="13.25" fill="none" stroke="#263653" stroke-width="1.5"/>

  <!-- Architectural Corner Crosshairs -->
  <path d="M 20 12 L 20 28 M 12 20 L 28 20" stroke="#FF2E93" stroke-width="1.2" stroke-opacity="0.6"/>
  <path d="M 830 12 L 830 28 M 822 20 L 838 20" stroke="#1E3152" stroke-width="1.2"/>
  <path d="M 20 232 L 20 248 M 12 240 L 28 240" stroke="#1E3152" stroke-width="1.2"/>
  <path d="M 830 232 L 830 248 M 822 240 L 838 240" stroke="#FF2E93" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(425, 0)" text-anchor="middle">
    
    <!-- Top Pill Badge -->
    <rect x="-140" y="32" width="280" height="26" rx="13" fill="#111E38" fill-opacity="0.85" stroke="#263653" stroke-width="1"/>
    <circle cx="-120" cy="45" r="3.5" fill="#FF2E93" filter="url(#pinkGlow)"/>
    <text x="10" y="49" class="pill-text">SYSTEMS · SOFTWARE · RESEARCH</text>

    <!-- Main Title -->
    <text x="0" y="105" class="title">MEDHANSH KABADWAL</text>

    <!-- Tagline with Italic Serif Contrast -->
    <text x="0" y="142" class="tagline">
      "I build software to <tspan fill="#FF2E93">understand</tspan> how systems work beneath the surface."
    </text>

    <!-- Divider Line -->
    <line x1="-220" y1="175" x2="220" y2="175" stroke="#1E3152" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Bottom Technical Metadata Badges -->
    <text x="0" y="208" class="meta-text">
      <tspan fill="#FF2E93">●</tspan> C++20 &amp; Computer Vision   
      <tspan fill="#263653"> │ </tspan>   
      <tspan fill="#38BDF8">●</tspan> Rust Microkernels (no_std)   
      <tspan fill="#263653"> │ </tspan>   
      <tspan fill="#FF2E93">●</tspan> Desktop Systems
    </text>
  </g>
</svg>
